grafana:
  enabled: true

  adminUser: admin

  service:
    type: ClusterIP

  ingress:
    enabled: true
    ingressClassName: nginx

    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    hosts:
      - grafana.ferdeve.fit

    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.ferdeve.fit

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi


prometheus:
  enabled: true

  ingress:
    enabled: true
    ingressClassName: nginx

    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    hosts:
      - prometheus.ferdeve.fit

    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.ferdeve.fit

  prometheusSpec:
    externalUrl: https://prometheus.ferdeve.fit
    retention: 24h

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi


alertmanager:
  enabled: true

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: slack
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"

    receivers:
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/url
            channel: "#devops-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}
              Severity: {{ .Labels.severity }}
              Namespace: {{ .Labels.namespace }}
              Summary: {{ .Annotations.summary }}
              Description: {{ .Annotations.description }}
              {{ end }}

      - name: "null"

  alertmanagerSpec:
    replicas: 1

    secrets:
      - slack-webhook


kube-state-metrics:
  enabled: true


nodeExporter:
  enabled: true


prometheusOperator:
  enabled: true